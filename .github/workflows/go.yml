name: Go CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify toolchain consistency
        run: bash scripts/verify_toolchain_consistency.sh

      - name: Run tests
        run: |
          go mod download
          go test -v ./...
          go vet ./...
          go build -o /tmp/otter .

      - name: Run submodule tests (bamdriver)
        run: |
          cd bamdriver
          go test -v ./...

      - name: Run submodule tests (pairbam)
        run: |
          cd pairbam
          go test -v ./...

      - name: Run submodule tests (xenofilx)
        run: |
          cd xenofilx
          go test -count=1 ./...
          go vet ./...
          # Keep the race gate aligned with xenofilx CI: real-BAM/BGZF tests
          # are covered by the normal suite and exceed runner budgets under race.
          go test -race -count=1 -short ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    # 仅构建 Linux amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          VERSION=${VERSION#refs/tags/}
          LDFLAGS="-s -w -X github.com/rainoffallingstar/otter/cmd.buildVersion=${VERSION#v} -X github.com/rainoffallingstar/otter/cmd.buildCommit=${COMMIT:0:7} -X github.com/rainoffallingstar/otter/cmd.buildDate=${DATE}"

          # 静态链接构建（适用于CentOS等低版本GLIBC环境）
          go build -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o otter-linux-amd64-static .

          # 动态链接构建（常规Linux）
          go build -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o otter-linux-amd64 .

          # 重命名产物
          mv otter-linux-amd64 otter-${VERSION#v}-linux-amd64
          mv otter-linux-amd64-static otter-${VERSION#v}-linux-amd64-static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: otter-*
          retention-days: 7
