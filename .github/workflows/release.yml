name: Release Binaries

on:
  push:
    tags: [ 'v*.*.*', 'daily-*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify toolchain consistency
        run: bash scripts/verify_toolchain_consistency.sh

      - name: Verify release evidence (if committed)
        run: |
          if [[ -f docs/review/release_evidence_latest.env ]]; then
            bash scripts/verify_release_evidence.sh
          else
            echo "No committed release evidence manifest found; skipping release evidence verification in CI."
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install system dependencies (musl + HDF5)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools pkg-config libhdf5-dev

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build xdxtools static
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          VER="${VERSION#v}"
          LDFLAGS="-s -w -X github.com/xdxtools/xdxtools-go/cmd.buildVersion=${VER} -X github.com/xdxtools/xdxtools-go/cmd.buildCommit=${COMMIT:0:7}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o dist/xdxtools-linux-amd64-static .
          echo "✓ xdxtools-linux-amd64-static"

      - name: Build Go submodules static
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          bash scripts/ensure_htseq2matrix_entrypoint.sh htseq2matrix-go

          build_go_submodule() {
            local dir="$1" out="$2" pkg="$3" sym="$4"
            local ld="-s -w"
            if [ -n "$sym" ]; then
              ld="$ld -X $sym=$VER"
            fi
            echo "Building $dir -> $out"
            (cd "$dir" && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="$ld" -o "../dist/$out" "$pkg")
            echo "✓ $out"
          }

          build_go_submodule xenofilter-go xenofilter-linux-amd64-static ./cmd/xenofilter github.com/rainoffallingstar/xenofilter-go/pkg/cli.Version
          build_go_submodule Paireads paireads-linux-amd64-static ./cmd/paireads main.Version
          build_go_submodule htseq2matrix-go htseq2matrix-linux-amd64-static ./cmd/htseq2matrix main.Version
          build_go_submodule gomats gomats-linux-amd64-static ./cmd/gomats github.com/rainoffallingstar/gomats/pkg/cli.Version

      - name: Build Rust static binaries (enva/qctb/fqc)
        run: |
          (cd enva && cargo build --release --target x86_64-unknown-linux-musl)
          cp enva/target/x86_64-unknown-linux-musl/release/enva dist/enva-linux-amd64-static
          echo "✓ enva-linux-amd64-static"

          (cd qctb && cargo build --release --target x86_64-unknown-linux-musl)
          cp qctb/target/x86_64-unknown-linux-musl/release/qctb dist/qctb-linux-amd64-static
          echo "✓ qctb-linux-amd64-static"

          (cd fastqc-rs && cargo build --release --target x86_64-unknown-linux-musl)
          cp fastqc-rs/target/x86_64-unknown-linux-musl/release/fqc dist/fqc-linux-amd64-static
          echo "✓ fqc-linux-amd64-static"

      - name: Build methrix-cli (dynamic HDF5)
        run: |
          export HDF5_INCLUDE_DIR=/usr/include/hdf5/serial
          export HDF5_LIB_DIR=/usr/lib/x86_64-linux-gnu/hdf5/serial
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH

          # Validate Ubuntu HDF5 layout before compiling (fail fast with clear logs).
          test -f /usr/include/hdf5/serial/hdf5.h
          test -f /usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5.so
          pkg-config --modversion hdf5 || pkg-config --modversion hdf5-serial
          pkg-config --cflags --libs hdf5 || pkg-config --cflags --libs hdf5-serial

          (cd methrix-cli && cargo build --release)
          if [ -f methrix-cli/target/release/methrix-cli ]; then
            cp methrix-cli/target/release/methrix-cli dist/methrix-cli-linux-amd64
          elif [ -f methrix-cli/target/release/methrix ]; then
            cp methrix-cli/target/release/methrix dist/methrix-cli-linux-amd64
          else
            echo "methrix-cli binary not found" >&2
            exit 1
          fi
          cp dist/methrix-cli-linux-amd64 dist/methrix-linux-amd64
          echo "✓ methrix-cli-linux-amd64 (dynamic)"

      - name: Verify required release artifacts (strict)
        run: bash scripts/verify_release_artifacts.sh dist

      - name: Verify tool versions
        run: bash scripts/verify_versions.sh dist

      - name: Generate metadata and checksums
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat > manifest.json <<EOF
          {
            "tag": "${TAG}",
            "commit": "${COMMIT}",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": [
              {"name":"xdxtools-linux-amd64-static","linkage":"static"},
              {"name":"enva-linux-amd64-static","linkage":"static"},
              {"name":"xenofilter-linux-amd64-static","linkage":"static"},
              {"name":"paireads-linux-amd64-static","linkage":"static"},
              {"name":"htseq2matrix-linux-amd64-static","linkage":"static"},
              {"name":"gomats-linux-amd64-static","linkage":"static"},
              {"name":"qctb-linux-amd64-static","linkage":"static"},
              {"name":"fqc-linux-amd64-static","linkage":"static"},
              {"name":"methrix-cli-linux-amd64","linkage":"dynamic"},
              {"name":"methrix-linux-amd64","linkage":"dynamic"}
            ]
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ startsWith(github.ref_name, 'daily-') }}
          body: |
            ## Release Model

            - Trigger: push of immutable release tags (`vX.Y.Z` or `vYYYY.MM.DD.N`) or movable daily aliases (`daily-YYYYMMDD`)
            - Immutable tags: archival release points that must never move
            - Daily aliases: same-day convenience tags that may be force-updated to the latest build for that UTC date
            - Policy: strict artifact completeness (missing required binaries => release fails)

            ## Linkage

            - Fully static: `xdxtools`, `enva`, `xenofilter`, `paireads`, `htseq2matrix`, `gomats`, `qctb`, `fqc`
            - Dynamic (HDF5): `methrix-cli` (`methrix` compatibility copy included)

            ## Installation

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/rainoffallingstar/xdxtools-go/main/scripts/install.sh)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
